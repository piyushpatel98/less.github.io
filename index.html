<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000+ Unique YT Names | Brand Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Start.io Web SDK Integration -->
    <script type="text/javascript">
        (function(s,t,a,r,tapp){
            tapp=s.startApp=s.startApp||function(){(tapp.q=tapp.q||[]).push(arguments)};
            tapp.l=1*new Date();r=t.createElement(a);r.async=1;
            r.src="https://cdn.start.io/web-sdk/v1/start.js";
            t=t.getElementsByTagName(a)[0];t.parentNode.insertBefore(r,t)
        })(window,document,"script");

        // Your App ID: 201283431
        startApp("201283431", {
            category: "Entertainment",
            onAdLoaded: function(adInfo) { console.log("Ad loaded:", adInfo); },
            onAdError: function(error) { console.error("Ad error:", error); }
        });
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .name-card:hover { transform: translateY(-2px); transition: all 0.2s ease; border-color: #38bdf8; }
        .toast { position: fixed; bottom: 20px; right: 20px; transform: translateY(100px); transition: transform 0.3s ease; z-index: 100; }
        .toast.show { transform: translateY(0); }
        .ad-container { min-height: 100px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border-radius: 12px; margin: 20px 0; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="py-10 px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold mb-4">YT <span class="gradient-text">Name Hub</span></h1>
        <p class="text-gray-400 max-w-2xl mx-auto">Browse over 1,000 hand-picked unique YouTube name ideas. Filter by niche, search keywords, or generate a random brand identity.</p>
    </header>

    <!-- Generator Tool -->
    <section class="max-w-4xl mx-auto px-4 mb-8">
        <div class="glass rounded-2xl p-6 md:p-8 text-center shadow-2xl">
            <h2 class="text-xl font-semibold mb-6">Insta-Generator</h2>
            <div id="random-name-display" class="text-3xl md:text-5xl font-bold mb-6 text-white tracking-tight">Click to Start</div>
            <button onclick="generateRandom()" class="bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 px-8 rounded-full transition-all flex items-center gap-2 mx-auto">
                <i class="fas fa-magic"></i> Generate Random Name
            </button>
        </div>
    </section>

    <!-- Banner Ad Placement -->
    <div class="max-w-4xl mx-auto px-4">
        <div class="ad-container" id="startio-banner-ad">
            <!-- Start.io Banner will render here -->
            <script>
                startApp("loadBanner", {
                    containerId: "startio-banner-ad",
                    adSize: "MEDIUM_RECTANGLE" 
                });
            </script>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4">
        
        <!-- Controls -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <i class="fas fa-search absolute left-4 top-1/2 -transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search names (e.g. 'Glitch', 'Neo', 'Tech')..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all">
            </div>
            <select id="nicheFilter" class="bg-slate-800 border border-slate-700 rounded-xl py-3 px-6 focus:outline-none focus:ring-2 focus:ring-sky-500">
                <option value="all">All Niches</option>
                <option value="gaming">Gaming</option>
                <option value="tech">Tech & Science</option>
                <option value="lifestyle">Lifestyle/Vlog</option>
                <option value="creative">Abstract/Modern</option>
                <option value="edgy">Edgy/Dark</option>
            </select>
        </div>

        <!-- Stats Bar -->
        <div class="flex justify-between items-center mb-6 text-sm text-gray-400">
            <p>Showing <span id="countDisplay" class="text-sky-400 font-bold">0</span> unique names</p>
            <p>Click a name to copy</p>
        </div>

        <!-- Name Grid -->
        <div id="nameGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Names will be injected here -->
        </div>

        <!-- Loading Trigger -->
        <div id="loadMore" class="mt-12 text-center hidden">
            <button onclick="renderNames(true)" class="text-sky-400 hover:text-white transition-colors">Load More Names...</button>
        </div>
    </main>

    <!-- Copy Toast -->
    <div id="toast" class="toast glass bg-green-600/20 text-green-400 px-6 py-3 rounded-lg border-green-500/50 flex items-center gap-2">
        <i class="fas fa-check-circle"></i> Copied to clipboard!
    </div>

    <script>
        const prefixes = ["Neo", "Glitch", "Iron", "Silent", "Zen", "Void", "Nova", "Cyber", "Arctic", "Urban", "Velvet", "Meta", "Hyper", "Solar", "Pixel", "Dark", "Blue", "Gold", "Rogue", "Elite", "Cloud", "Shadow", "Logic", "Vibe", "Static", "Aero", "Pulse", "Cinder", "Ember", "Frost"];
        const suffixes = ["Mantra", "Logic", "Flux", "Theory", "Orbit", "Echo", "Metric", "Fable", "Zenith", "Vault", "Sync", "Grid", "Shift", "Core", "Node", "Link", "Verse", "Quest", "Root", "Scope", "Drift", "Wave", "Point", "Path", "Edge", "Vortex", "Burst", "Spire", "Rise", "Spark"];
        const niches = ["gaming", "tech", "lifestyle", "creative", "edgy"];

        const allNames = [];
        
        function seedData() {
            const used = new Set();
            while (allNames.length < 1000) {
                const p = prefixes[Math.floor(Math.random() * prefixes.length)];
                const s = suffixes[Math.floor(Math.random() * suffixes.length)];
                const n = niches[Math.floor(Math.random() * niches.length)];
                const name = Math.random() > 0.5 ? p + s : p + " " + s;
                
                if (!used.has(name)) {
                    allNames.push({ name, niche: n });
                    used.add(name);
                }
            }
        }

        let displayLimit = 40;
        let filteredNames = [];

        function renderNames(loadMore = false) {
            if (loadMore) displayLimit += 40;
            
            const grid = document.getElementById('nameGrid');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const nicheTerm = document.getElementById('nicheFilter').value;

            filteredNames = allNames.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm);
                const matchesNiche = nicheTerm === 'all' || item.niche === nicheTerm;
                return matchesSearch && matchesNiche;
            });

            document.getElementById('countDisplay').innerText = filteredNames.length;
            
            const slice = filteredNames.slice(0, displayLimit);
            grid.innerHTML = slice.map(item => `
                <div onclick="copyName('${item.name}')" class="name-card glass p-4 rounded-xl cursor-pointer text-center group relative overflow-hidden">
                    <span class="text-sm uppercase tracking-widest text-gray-500 mb-1 block">${item.niche}</span>
                    <span class="text-lg font-semibold text-slate-200 group-hover:text-sky-400">${item.name}</span>
                    <div class="absolute inset-0 bg-sky-500/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <i class="fas fa-copy text-sky-400"></i>
                    </div>
                </div>
            `).join('');

            document.getElementById('loadMore').style.display = (displayLimit < filteredNames.length) ? 'block' : 'none';
        }

        function copyName(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function generateRandom() {
            // Trigger Interstitial Ad on click (if available)
            if (window.startApp && typeof window.startApp === 'function') {
                startApp("showInterstitial");
            }

            const display = document.getElementById('random-name-display');
            display.classList.add('animate-pulse');
            setTimeout(() => {
                const random = allNames[Math.floor(Math.random() * allNames.length)].name;
                display.innerText = random;
                display.classList.remove('animate-pulse');
            }, 300);
        }

        window.onload = () => {
            seedData();
            renderNames();
            
            document.getElementById('searchInput').addEventListener('input', () => {
                displayLimit = 40;
                renderNames();
            });
            
            document.getElementById('nicheFilter').addEventListener('change', () => {
                displayLimit = 40;
                renderNames();
            });
        };
    </script>
</body>
  </html>
